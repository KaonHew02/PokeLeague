<!doctype html>
<!-- dev.html: the source page. Edit this one; tools/build.js generates index.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Only the game's own scripts may run: nothing injected into the page
     (onerror=, a script tag inside a text...) can execute. -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self' file:; object-src 'none'; base-uri 'self'">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PokeLeague</title>
<meta name="description" content="A free fan-made Pokémon adventure for the browser and phones: pick a starter, catch and train Pokémon, beat the gyms and the League, region by region.">
<meta name="theme-color" content="#0a1430">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PokeLeague">
<link rel="preload" href="assets/fonts/PixelifyPS-400.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="assets/fonts/PixelifyPS-700.ttf" as="font" type="font/ttf" crossorigin>
<!-- css:begin -->
<link rel="stylesheet" href="css/base.css">

<script src="js/core/locales.js"></script>
</head>
<body>

<!-- The game: a 3:2 frame (canvas + every screen). Modules add their own
     overlays (dialog box, battle HUD) inside #frame. -->
<div id="frame">
  <canvas id="game"></canvas>

  <!-- ====== Title ====== -->
  <section id="scr-title" class="scr title hidden">
    <div class="title-logo">
      <div class="t1" translate="no">PokeLeague</div>
      <div class="t2">Region by region, all the way to the League</div>
    </div>
    <div class="box title-menu">
      <div class="menu-list">
        <button class="menu-item" id="t-continue">Continue</button>
        <button class="menu-item" id="t-new" data-first>New game</button>
        <button class="menu-item" id="t-options">Settings</button>
        <button class="menu-item" id="t-credits">Credits</button>
      </div>
    </div>
    <button class="icon-btn title-mute" id="t-mute" title="Sound" data-nonav></button>
    <p class="title-foot">Free fan game, not for sale · Based on PokéSurvivor by JPTER78</p>
  </section>

  <!-- ====== Settings (options-ui.js); opens over the title or the start menu ====== -->
  <section id="scr-options" class="scr dim hidden">
    <div class="box options">
      <div class="opt-head"><h3>Settings</h3><button class="btn small ghost" id="opt-back" data-back>Back</button></div>
      <div class="opt-tabs" id="opt-tabs">
        <button class="opt-tab" data-t="game">Game</button>
        <button class="opt-tab" data-t="sound">Sound</button>
        <button class="opt-tab" data-t="controls">Controls</button>
        <button class="opt-tab" data-t="display">Display</button>
      </div>
      <div class="opt-body" id="opt-body" translate="no"></div>
    </div>
  </section>

  <!-- Credits: js/ui/credits-ui.js builds its own screen. -->
</div>

<!-- Phones held upright: a hint below the game (base.css shows it only in portrait on touch screens). -->
<div class="rotate-hint" aria-hidden="true">
  <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="18.5" r="1" fill="currentColor"/></svg>
  <span>Turn your phone sideways for a bigger screen.</span>
</div>

<div id="boot" class="boot">
  <div class="boot-in">
    <h1 translate="no">PokeLeague</h1>
    <p class="boot-ld">Loading…</p>
  </div>
</div>
<div id="tap-start" class="tapstart hidden">
  <div class="boot-in">
    <h1 translate="no">PokeLeague</h1>
    <p class="tap-blink">Tap or press any key</p>
  </div>
</div>
<noscript>
  <div class="boot noscript"><div class="boot-in"><h1>PokeLeague</h1><p>JavaScript is needed to play.</p></div></div>
</noscript>
